# Render.com Blueprint — 1-click Free Tier Docker deployment paired with Turso Cloud SQLite
services:
  - type: web
    name: liveecho
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/healthz
    envVars:
      - key: CONCERT_TRACKER_ENV
        value: production
      - key: CONCERT_TRACKER_TLS
        value: "1"
      - key: CONTAINER_RUNTIME
        value: "1"
      - key: CONCERT_TRACKER_ALLOW_PUBLIC_BIND
        value: "1"
      - key: CONCERT_TRACKER_HOST
        value: "0.0.0.0"
      - key: CONCERT_TRACKER_SECRET_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
